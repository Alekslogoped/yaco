<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Шоколадный сюрприз — звук Ц</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial, sans-serif;
    background:#f4d7a7;
}

.game{
    width:100vw;
    height:100vh;
    min-height:520px;
    position:relative;
    overflow:hidden;

    background-image:url("fon.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* ЗАГОЛОВОК */

.title{
    position:absolute;
    z-index:30;
    top:16px;
    left:50%;
    transform:translateX(-50%);

    background:rgba(255,255,255,.93);
    padding:11px 27px;
    border-radius:30px;
    box-shadow:0 6px 18px rgba(0,0,0,.16);

    font-size:clamp(17px,2vw,26px);
    font-weight:800;
    color:#67371e;
    white-space:nowrap;
}

.counter{
    position:absolute;
    right:25px;
    top:20px;
    z-index:40;

    background:rgba(255,255,255,.94);
    padding:10px 17px;
    border-radius:22px;

    font-weight:bold;
    color:#754228;

    box-shadow:0 5px 15px rgba(0,0,0,.12);
}

/* ОСНОВНАЯ ОБЛАСТЬ */

.play-area{
    position:absolute;
    left:0;
    right:0;
    top:76px;
    bottom:12px;

    display:grid;
    grid-template-columns:42% 58%;
}

/* ЛЕВАЯ ЧАСТЬ */

.left-zone{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* ЯЙЦО */

.egg-wrapper{
    position:absolute;

    width:430px;
    height:510px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
    z-index:20;

    transform:translateX(35px);
}

.egg-closed{
    position:absolute;

    width:330px;
    height:auto;

    object-fit:contain;

    z-index:5;

    filter:drop-shadow(
        0 16px 15px rgba(70,35,15,.28)
    );

    transition:
        opacity .25s ease,
        transform .3s ease;
}

.egg-wrapper:not(.open):hover .egg-closed{
    transform:scale(1.035);
}

/* ТРЯСКА ЯЙЦА */

.egg-wrapper.shake .egg-closed{
    animation:eggShake .58s ease;
}

@keyframes eggShake{
    0%,100%{
        transform:rotate(0) scale(1);
    }

    15%{
        transform:rotate(-6deg) scale(1.02);
    }

    30%{
        transform:rotate(6deg) scale(1.02);
    }

    45%{
        transform:rotate(-5deg) scale(1.03);
    }

    60%{
        transform:rotate(5deg) scale(1.03);
    }

    75%{
        transform:rotate(-3deg) scale(1.02);
    }

    90%{
        transform:rotate(3deg) scale(1.01);
    }
}

/* ПОЛОВИНКИ ЯЙЦА */

.egg-half{
    position:absolute;

    width:285px;
    height:auto;

    object-fit:contain;

    opacity:0;
    pointer-events:none;

    filter:drop-shadow(
        0 14px 13px rgba(70,35,15,.22)
    );

    transition:
        transform .85s cubic-bezier(.2,.8,.25,1),
        opacity .18s ease;
}

.egg-left{
    z-index:4;
    transform:translateX(0) rotate(0) scale(.95);
}

.egg-right{
    z-index:4;
    transform:translateX(0) rotate(0) scale(.95);
}

.egg-wrapper.open .egg-closed{
    opacity:0;
    transform:scale(.9);
    pointer-events:none;
}

.egg-wrapper.open .egg-half{
    opacity:1;
}

.egg-wrapper.open .egg-left{
    transform:
        translateX(-145px)
        rotate(-13deg)
        scale(.88);
}

.egg-wrapper.open .egg-right{
    transform:
        translateX(145px)
        rotate(13deg)
        scale(.88);
}

/* ГЕРОЙ */

.hero{
    position:absolute;

    width:190px;
    height:190px;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:100;

    opacity:0;
    transform:scale(.15);

    cursor:grab;
    touch-action:none;

    transition:
        opacity .4s ease,
        transform .5s cubic-bezier(.2,1.4,.4,1);
}

.hero.show{
    opacity:1;
    transform:scale(1);
}

.hero.dragging{
    cursor:grabbing;
    transition:none;
    z-index:5000;
}

.hero-image{
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;

    filter:drop-shadow(
        0 9px 7px rgba(0,0,0,.18)
    );
}

.hero-emoji{
    font-size:130px;
    line-height:1;
}

/* ПОДСКАЗКА */

.hint{
    position:absolute;

    bottom:17px;
    left:50%;
    transform:translateX(-50%);

    z-index:300;

    background:rgba(255,255,255,.94);
    padding:11px 20px;
    border-radius:25px;

    font-size:17px;
    font-weight:bold;
    color:#704126;

    text-align:center;
    min-width:310px;

    box-shadow:0 5px 15px rgba(0,0,0,.13);
}

/* ПРАВАЯ ЧАСТЬ */

.right-zone{
    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px 35px 48px 15px;
}

.shadow-grid{
    width:100%;
    max-width:690px;

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

/* КАРТОЧКИ ТЕНЕЙ */

.shadow-card{
    height:215px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:28px;

    border:4px dashed rgba(255,255,255,.94);
    background:rgba(255,255,255,.28);

    backdrop-filter:blur(2px);

    transition:
        transform .22s ease,
        background .22s ease;
}

.shadow-card.hover{
    transform:scale(1.045);
    background:rgba(255,255,255,.62);
}

/* PNG-ТЕНИ */

.shadow-image{
    width:88%;
    height:88%;

    object-fit:contain;
    pointer-events:none;

    transition:
        transform .3s ease,
        opacity .3s ease;
}

/* ВРЕМЕННЫЕ ЭМОДЗИ */

.shadow-character{
    font-size:132px;
    line-height:1;

    display:flex;
    align-items:center;
    justify-content:center;

    filter:
        grayscale(1)
        brightness(.06);

    opacity:.72;
}

.variant-0{
    transform:scale(1);
}

.variant-1{
    transform:scale(.82);
}

.variant-2{
    transform:
        rotate(-13deg)
        scale(.95);
}

.variant-3{
    transform:
        scaleX(.72)
        scaleY(1.08);
}

/* ПРАВИЛЬНЫЙ ОТВЕТ */

.shadow-card.success{
    background:rgba(230,255,209,.94);
    border:5px solid white;
    transform:scale(1.04);
}

.shadow-card.success .shadow-image{
    animation:successPop .5s ease;
}

.shadow-card.success .shadow-character{
    filter:none;
    opacity:1;
    animation:successPop .5s ease;
}

@keyframes successPop{
    0%{
        transform:scale(.8);
    }

    55%{
        transform:scale(1.18);
    }

    100%{
        transform:scale(1);
    }
}

/* ОШИБКА */

.shadow-card.wrong{
    animation:wrongShake .35s ease;
}

@keyframes wrongShake{
    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-8px);
    }

    75%{
        transform:translateX(8px);
    }
}

/* СООБЩЕНИЕ */

.message{
    position:absolute;

    z-index:6000;

    left:50%;
    top:48%;

    transform:
        translate(-50%,-50%)
        scale(.7);

    background:white;

    padding:20px 35px;
    border-radius:30px;

    font-size:clamp(24px,3vw,42px);
    font-weight:800;

    color:#69391f;

    box-shadow:
        0 15px 40px rgba(0,0,0,.25);

    opacity:0;
    pointer-events:none;

    transition:.25s;
}

.message.show{
    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);
}

/* КНОПКА ДАЛЬШЕ */

.next-btn{
    position:absolute;

    z-index:1500;

    right:35px;
    bottom:23px;

    border:none;
    border-radius:30px;

    padding:15px 27px;

    background:#ffd044;
    color:#63391f;

    font-size:19px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:0 7px 0 #dba62b;

    display:none;
}

.next-btn:active{
    transform:translateY(4px);
    box-shadow:0 3px 0 #dba62b;
}

/* ФИНАЛ */

.finish{
    position:absolute;
    inset:0;

    z-index:9000;

    display:none;

    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:rgba(255,245,215,.94);
}

.finish-title{
    font-size:clamp(38px,6vw,75px);
    font-weight:900;
    color:#69381e;
}

.finish-icons{
    font-size:120px;
    margin:20px 0;
}

.finish-text{
    font-size:clamp(21px,3vw,32px);
    color:#865438;
}

.restart{
    margin-top:25px;

    border:none;

    padding:15px 30px;
    border-radius:30px;

    background:#ffd044;
    color:#63391f;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;
}

/* АДАПТАЦИЯ */

@media(max-width:850px){

    .play-area{
        grid-template-columns:40% 60%;
    }

    .egg-wrapper{
        transform:
            translateX(25px)
            scale(.72);
    }

    .shadow-grid{
        gap:10px;
    }

    .shadow-card{
        height:155px;
    }

    .shadow-character{
        font-size:90px;
    }

    .hero{
        width:125px;
        height:125px;
    }

    .hero-emoji{
        font-size:90px;
    }

    .hint{
        font-size:14px;
        min-width:210px;
    }
}

</style>
</head>

<body>

<div class="game">

    <div class="title">
        🍫 Шоколадный сюрприз — звук Ц
    </div>

    <div class="counter" id="counter">
        1 / 8
    </div>

    <div class="play-area">

        <!-- ЛЕВАЯ ЧАСТЬ -->

        <div class="left-zone">

            <div
                class="egg-wrapper"
                id="eggWrapper"
            >

                <img
                    src="egg/egg_closed.png"
                    class="egg-closed"
                    alt=""
                    draggable="false"
                >

                <img
                    src="egg/egg_left.png"
                    class="egg-half egg-left"
                    alt=""
                    draggable="false"
                >

                <img
                    src="egg/egg_right.png"
                    class="egg-half egg-right"
                    alt=""
                    draggable="false"
                >

            </div>

            <div
                class="hero"
                id="hero"
            ></div>

            <div
                class="hint"
                id="hint"
            >
                Нажми на шоколадное яйцо!
            </div>

        </div>

        <!-- ПРАВАЯ ЧАСТЬ -->

        <div class="right-zone">

            <div
                class="shadow-grid"
                id="shadowGrid"
            ></div>

        </div>

    </div>

    <div
        class="message"
        id="message"
    ></div>

    <button
        class="next-btn"
        id="nextBtn"
    >
        Следующий сюрприз →
    </button>


    <!-- ФИНАЛ -->

    <div
        class="finish"
        id="finish"
    >

        <div class="finish-title">
            Все сюрпризы найдены!
        </div>

        <div class="finish-icons">
            🎉 🍫 👑
        </div>

        <div class="finish-text">
            Ты нашёл все правильные тени!
        </div>

        <button
            class="restart"
            onclick="location.reload()"
        >
            Играть ещё раз
        </button>

    </div>

</div>


<script>

/* =========================
   УРОВНИ
========================= */

const levels = [

    /* 1. ЦЫПЛЁНОК */

    {
        name:"Цыплёнок",
        type:"image",

        hero:
            "heroes/ciplenok/hero.png",

        shadows:[
            "heroes/ciplenok/shadow_correct.png",
            "heroes/ciplenok/shadow_1.png",
            "heroes/ciplenok/shadow_2.png",
            "heroes/ciplenok/shadow_3.png"
        ]
    },


    /* 2. ЦАПЛЯ */

    {
        name:"Цапля",
        type:"image",

        hero:
            "heroes/caplya/hero.png",

        shadows:[
            "heroes/caplya/shadow_correct.png",
            "heroes/caplya/shadow_1.png",
            "heroes/caplya/shadow_2.png",
            "heroes/caplya/shadow_3.png"
        ]
    },


    /* 3. ЦИКЛОП */

    {
        name:"Циклоп",
        type:"image",

        hero:
            "heroes/ciklop/hero.png",

        shadows:[
            "heroes/ciklop/shadow_correct.png",
            "heroes/ciklop/shadow_1.png",
            "heroes/ciklop/shadow_2.png",
            "heroes/ciklop/shadow_3.png"
        ]
    },


    /* 4. ЦАРЬ */

    {
        name:"Царь",
        type:"emoji",
        emoji:"🤴"
    },


    /* 5. ЦАРЕВНА */

    {
        name:"Царевна",
        type:"emoji",
        emoji:"👸"
    },


    /* 6. ЦЫГАНКА */

    {
        name:"Цыганка",
        type:"emoji",
        emoji:"💃"
    },


    /* 7. ЦЕПЬ */

    {
        name:"Цепь",
        type:"emoji",
        emoji:"🔗"
    },


    /* 8. ЦАРСТВО */

    {
        name:"Царство",
        type:"emoji",
        emoji:"🏰"
    }

];


/* =========================
   ЭЛЕМЕНТЫ
========================= */

const eggWrapper =
    document.getElementById("eggWrapper");

const hero =
    document.getElementById("hero");

const shadowGrid =
    document.getElementById("shadowGrid");

const hint =
    document.getElementById("hint");

const counter =
    document.getElementById("counter");

const message =
    document.getElementById("message");

const nextBtn =
    document.getElementById("nextBtn");

const finish =
    document.getElementById("finish");


/* =========================
   СОСТОЯНИЕ
========================= */

let currentLevel = 0;

let eggOpened = false;
let completed = false;

let dragging = false;

let grabOffsetX = 0;
let grabOffsetY = 0;

let originalLeft = 0;
let originalTop = 0;


/* =========================
   СОЗДАЁМ УРОВЕНЬ
========================= */

function createLevel(){

    eggOpened = false;
    completed = false;
    dragging = false;

    eggWrapper.classList.remove("open");
    eggWrapper.classList.remove("shake");

    hero.classList.remove("show");
    hero.classList.remove("dragging");

    hero.style.display = "flex";
    hero.style.position = "absolute";

    hero.style.left = "";
    hero.style.top = "";

    hero.style.transition = "";

    hero.innerHTML = "";

    nextBtn.style.display = "none";

    counter.textContent =
        (currentLevel + 1)
        +
        " / "
        +
        levels.length;

    hint.textContent =
        "Нажми на шоколадное яйцо!";

    createHero();
    createShadows();
}


/* =========================
   СОЗДАЁМ ГЕРОЯ
========================= */

function createHero(){

    const level =
        levels[currentLevel];

    hero.innerHTML = "";

    if(level.type === "image"){

        const img =
            document.createElement("img");

        img.src =
            level.hero;

        img.className =
            "hero-image";

        img.alt =
            level.name;

        img.draggable =
            false;

        hero.appendChild(img);
    }

    else{

        const emoji =
            document.createElement("div");

        emoji.className =
            "hero-emoji";

        emoji.textContent =
            level.emoji;

        hero.appendChild(emoji);
    }
}


/* =========================
   СОЗДАЁМ 4 ТЕНИ
========================= */

function createShadows(){

    shadowGrid.innerHTML = "";

    const level =
        levels[currentLevel];

    let variants =
        [0,1,2,3];

    variants =
        shuffleArray(variants);


    variants.forEach(
        variant => {

            const card =
                document.createElement("div");

            card.className =
                "shadow-card";

            card.dataset.variant =
                variant;


            /* PNG */

            if(level.type === "image"){

                const img =
                    document.createElement("img");

                img.src =
                    level.shadows[variant];

                img.className =
                    "shadow-image";

                img.alt = "";

                img.draggable =
                    false;

                card.appendChild(img);
            }


            /* ВРЕМЕННЫЕ ЭМОДЗИ */

            else{

                const character =
                    document.createElement("div");

                character.className =
                    "shadow-character variant-"
                    +
                    variant;

                character.textContent =
                    level.emoji;

                card.appendChild(
                    character
                );
            }


            shadowGrid.appendChild(
                card
            );
        }
    );
}


/* =========================
   ПЕРЕМЕШИВАНИЕ
========================= */

function shuffleArray(array){

    const newArray =
        [...array];

    for(
        let i =
            newArray.length - 1;

        i > 0;

        i--
    ){

        const j =
            Math.floor(
                Math.random()
                *
                (i + 1)
            );

        [
            newArray[i],
            newArray[j]
        ]
        =
        [
            newArray[j],
            newArray[i]
        ];
    }

    return newArray;
}


/* =========================
   ОТКРЫТИЕ ЯЙЦА
========================= */

eggWrapper.addEventListener(
    "click",
    openEgg
);


function openEgg(){

    if(eggOpened){
        return;
    }

    eggOpened = true;

    eggWrapper.classList.add(
        "shake"
    );

    hint.textContent =
        "Что спряталось внутри?";


    setTimeout(
        () => {

            eggWrapper.classList.remove(
                "shake"
            );

            eggWrapper.classList.add(
                "open"
            );

        },
        600
    );


    setTimeout(
        () => {

            hero.classList.add(
                "show"
            );

            hint.textContent =
                "Назови: «"
                +
                levels[currentLevel].name
                +
                "». Найди точно такую же тень!";

        },
        1250
    );
}


/* =========================
   DRAG & DROP
========================= */

hero.addEventListener(
    "pointerdown",
    startDrag
);

hero.addEventListener(
    "pointermove",
    dragMove
);

hero.addEventListener(
    "pointerup",
    endDrag
);

hero.addEventListener(
    "pointercancel",
    cancelDrag
);


/* =========================
   НАЧАЛО ПЕРЕТАСКИВАНИЯ
========================= */

function startDrag(e){

    if(
        !eggOpened
        ||
        completed
    ){
        return;
    }

    e.preventDefault();

    dragging = true;

    hero.setPointerCapture(
        e.pointerId
    );

    const rect =
        hero.getBoundingClientRect();

    originalLeft =
        rect.left;

    originalTop =
        rect.top;

    grabOffsetX =
        e.clientX
        -
        rect.left;

    grabOffsetY =
        e.clientY
        -
        rect.top;

    hero.style.position =
        "fixed";

    hero.style.left =
        rect.left + "px";

    hero.style.top =
        rect.top + "px";

    hero.classList.add(
        "dragging"
    );
}


/* =========================
   ДВИЖЕНИЕ
========================= */

function dragMove(e){

    if(!dragging){
        return;
    }

    e.preventDefault();

    hero.style.left =
        (
            e.clientX
            -
            grabOffsetX
        )
        + "px";

    hero.style.top =
        (
            e.clientY
            -
            grabOffsetY
        )
        + "px";


    document
    .querySelectorAll(
        ".shadow-card"
    )
    .forEach(
        card => {

            card.classList.remove(
                "hover"
            );

            const rect =
                card
                .getBoundingClientRect();

            if(
                e.clientX >= rect.left
                &&
                e.clientX <= rect.right
                &&
                e.clientY >= rect.top
                &&
                e.clientY <= rect.bottom
            ){

                card.classList.add(
                    "hover"
                );
            }
        }
    );
}


/* =========================
   ОТПУСКАЕМ ГЕРОЯ
========================= */

function endDrag(e){

    if(!dragging){
        return;
    }

    dragging = false;

    hero.classList.remove(
        "dragging"
    );

    let target = null;


    document
    .querySelectorAll(
        ".shadow-card"
    )
    .forEach(
        card => {

            card.classList.remove(
                "hover"
            );

            const rect =
                card
                .getBoundingClientRect();

            if(
                e.clientX >= rect.left
                &&
                e.clientX <= rect.right
                &&
                e.clientY >= rect.top
                &&
                e.clientY <= rect.bottom
            ){

                target = card;
            }
        }
    );


    if(!target){

        returnHero();
        return;
    }


    const variant =
        Number(
            target.dataset.variant
        );


    /* variant 0 = правильная тень */

    if(variant === 0){

        correctAnswer(
            target
        );
    }

    else{

        wrongAnswer(
            target
        );
    }
}


/* =========================
   CANCEL
========================= */

function cancelDrag(){

    if(!dragging){
        return;
    }

    dragging = false;

    hero.classList.remove(
        "dragging"
    );

    returnHero();
}


/* =========================
   НЕПРАВИЛЬНО
========================= */

function wrongAnswer(target){

    target.classList.add(
        "wrong"
    );

    message.textContent =
        "Посмотри внимательнее 😊";

    showMessage();


    setTimeout(
        () => {

            target.classList.remove(
                "wrong"
            );

        },
        400
    );


    returnHero();
}


/* =========================
   ПРАВИЛЬНО
========================= */

function correctAnswer(target){

    completed = true;

    target.classList.add(
        "success"
    );

    hero.style.display =
        "none";

    const level =
        levels[currentLevel];


    /* ТЕНЬ СТАНОВИТСЯ ЦВЕТНОЙ */

    if(level.type === "image"){

        const img =
            target.querySelector(
                ".shadow-image"
            );

        if(img){

            img.src =
                level.hero;
        }
    }


    message.textContent =
        "Точно! ⭐";

    showMessage();


    hint.textContent =
        "Правильно! Это «"
        +
        level.name
        +
        "».";


    setTimeout(
        () => {

            nextBtn.style.display =
                "block";

        },
        700
    );
}


/* =========================
   ВОЗВРАТ ГЕРОЯ
========================= */

function returnHero(){

    hero.style.transition =
        "left .35s ease, top .35s ease";

    hero.style.left =
        originalLeft
        +
        "px";

    hero.style.top =
        originalTop
        +
        "px";


    setTimeout(
        () => {

            hero.style.position =
                "absolute";

            hero.style.left =
                "";

            hero.style.top =
                "";

            hero.style.transition =
                "";

        },
        370
    );
}


/* =========================
   СООБЩЕНИЕ
========================= */

function showMessage(){

    message.classList.add(
        "show"
    );

    setTimeout(
        () => {

            message.classList.remove(
                "show"
            );

        },
        1100
    );
}


/* =========================
   СЛЕДУЮЩИЙ РАУНД
========================= */

nextBtn.addEventListener(
    "click",
    nextLevel
);


function nextLevel(){

    currentLevel++;


    if(
        currentLevel
        >=
        levels.length
    ){

        finish.style.display =
            "flex";

        return;
    }


    createLevel();
}


/* =========================
   СТАРТ
========================= */

createLevel();

</script>

</body>
</html>
